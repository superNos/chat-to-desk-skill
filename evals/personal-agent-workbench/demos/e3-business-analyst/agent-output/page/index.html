<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>临时数据问题工作台</title><link rel="stylesheet" href="/style.css"><script defer src="/_workbench/client.js"></script><script defer src="/app.js"></script></head>
<body><main><h1>临时数据问题工作台</h1>
<section><h2>指标口径</h2><p>活跃会员 · 近 30 天有消费的会员</p></section>
<section><h2>新建问题</h2><form id="new"><label>问题名称<input name="title" required maxlength="100"></label><label>指标<select name="metric"><option>活跃会员</option><option>复购率</option></select></label><button>保存问题</button></form></section>

<p id="feedback" role="status"></p><h2>同事提问</h2><div id="questions"></div></main></body></html>
