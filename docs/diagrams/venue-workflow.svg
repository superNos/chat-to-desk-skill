<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1000" viewBox="0 0 1120 1000" role="img" aria-labelledby="title desc">
<title id="title">把比较场地报价，变成自己的常用功能</title>
<desc id="desc">从授权历史中沿用档期、含设备总价和取消期限的比较习惯。工作台显示三家场地的对照结果，未注明的取消期限标为待询问。补充报价后继续同一事项，后台更新结果并保留旧版。虚构数据示意。</desc>
<style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#24334a} .muted{fill:#65738a} .bold{font-weight:600} .blue{fill:#2563eb}</style>
<rect x="0" y="0" width="1120" height="1000" rx="16" fill="#f3f6fb" stroke="none"/>
<text x="40" y="56" font-size="30" class="bold">把常做的事，变成顺手的功能</text>
<text x="40" y="91" font-size="20" class="muted">你只交代这次的变化，助手沿用你已经确认的做法。</text>
<rect x="40" y="122" width="1040" height="108" rx="10" fill="#e9effb" stroke="none"/>
<text x="62" y="156" font-size="18" class="bold blue">从过往活动中留下的习惯</text>
<text x="62" y="190" font-size="22" class="bold">看档期  /  比含设备总价  /  查取消期限</text>
<text x="62" y="215" font-size="17" class="muted">“没写取消期限的单独标出来，我来问。”</text>
<rect x="40" y="254" width="1040" height="548" rx="10" fill="#fff" stroke="#dce3ed"/>
<rect x="41" y="255" width="1038" height="58" rx="10" fill="#fafbfd" stroke="none"/>
<text x="62" y="292" font-size="20" class="bold">活动筹备</text>
<text x="184" y="292" font-size="18" class="muted">/   冬季分享会</text>
<rect x="934" y="273" width="122" height="27" rx="5" fill="#edf7f1" stroke="none"/>
<text x="947" y="292" font-size="15" class="" style="fill:#2a7650">●  结果已更新</text>
<path d="M40 314H1080" stroke="#e5eaf1"/>
<rect x="41" y="315" width="186" height="486" rx="0" fill="#fafbfd" stroke="none"/>
<text x="62" y="352" font-size="16" class="muted">正在筹备</text>
<rect x="51" y="371" width="166" height="44" rx="6" fill="#eaf1ff" stroke="none"/>
<text x="66" y="399" font-size="18" class="bold blue">冬季分享会</text>
<text x="66" y="452" font-size="18" class="muted">客户交流日</text>
<path d="M60 477H207" stroke="#e5eaf1"/>
<text x="66" y="513" font-size="16" class="muted">已结束的活动</text>
<path d="M227 315L227 802" stroke="#e5eaf1"/>
<text x="254" y="354" font-size="25" class="bold">场地报价</text>
<rect x="894" y="326" width="156" height="40" rx="6" fill="#2563eb" stroke="none"/>
<text text-anchor="middle" x="972.0" y="352" font-size="17" class="" style="fill:#fff">＋ 比较场地报价</text>
<text x="254" y="385" font-size="17" class="muted">12 月 14 日 · 30 人 · 本次比较 3 份报价</text>
<rect x="254" y="407" width="796" height="85" rx="7" fill="#f0f5ff" stroke="none"/>
<text x="272" y="437" font-size="20" class="bold">两家档期可用，青禾空间的取消期限还需询问。</text>
<text x="272" y="470" font-size="17" class="muted">含投影的新报价已计入；原报价可在下方展开。</text>
<rect x="254" y="510" width="796" height="40" rx="5" fill="#f6f8fb" stroke="none"/>
<text x="268" y="537" font-size="17" class="muted">场地</text>
<text x="480" y="537" font-size="17" class="muted">当天档期</text>
<text x="635" y="537" font-size="17" class="muted">含设备总价</text>
<text x="831" y="537" font-size="17" class="muted">最晚免费取消</text>
<text x="268" y="583" font-size="18" class="">青禾空间</text>
<text x="480" y="583" font-size="18" class="" style="fill:#2a7650">可订</text>
<text x="635" y="583" font-size="18" class="bold">¥6,800</text>
<rect x="825" y="562" width="82" height="28" rx="4" fill="#fff4dc" stroke="none"/>
<text x="833" y="582" font-size="17" class="" style="fill:#946013">待询问</text>
<path d="M254 602H1050" stroke="#e5eaf1"/>
<text x="268" y="635" font-size="18" class="">河畔会客厅</text>
<text x="480" y="635" font-size="18" class="" style="fill:#2a7650">可订</text>
<text x="635" y="635" font-size="18" class="bold">¥7,500</text>
<text x="831" y="635" font-size="18" class="">12 月 10 日</text>
<path d="M254 654H1050" stroke="#e5eaf1"/>
<text x="268" y="687" font-size="18" class="">城西工坊</text>
<text x="480" y="687" font-size="18" class="">已订满</text>
<text x="635" y="687" font-size="18" class="bold">¥7,200</text>
<text x="831" y="687" font-size="18" class="">12 月 9 日</text>
<path d="M254 706H1050" stroke="#e5eaf1"/>
<text x="256" y="742" font-size="17" class="muted">›  原报价与比较依据</text>
<text x="837" y="742" font-size="17" class="muted">›  历次结果（2）</text>
<path d="M254 759H1050" stroke="#e5eaf1"/>
<text x="256" y="785" font-size="16" class="muted">有新报价时，继续这场活动即可。</text>
<rect x="40" y="826" width="1040" height="126" rx="10" fill="#fff" stroke="#dce3ed"/>
<text x="62" y="860" font-size="21" class="bold">对方发来了补价</text>
<text x="62" y="890" font-size="17" class="blue">补充新报价</text>
<rect x="210" y="865" width="544" height="40" rx="6" fill="#f8fafc" stroke="#e0e6ef"/>
<text x="226" y="891" font-size="17" class="muted">这份是青禾空间含投影的新报价。</text>
<rect x="774" y="865" width="126" height="40" rx="6" fill="#2563eb" stroke="none"/>
<text text-anchor="middle" x="837.0" y="891" font-size="17" class="" style="fill:#fff">更新比较</text>
<text x="62" y="931" font-size="18" class="muted">后台继续原事项  →  进度和结果自动回来  →  新旧版本都能找回</text>
<text x="40" y="982" font-size="15" class="muted">场地与报价均为虚构示例；工作台的功能随每个人的工作而变化。</text>
</svg>
