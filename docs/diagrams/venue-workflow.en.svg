<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1000" viewBox="0 0 1120 1000" role="img" aria-labelledby="title desc">
<title id="title">Turn venue comparison into a reusable action</title>
<desc id="desc">An illustrative workbench compares three fictional venue quotes using preferences from authorized history. Missing cancellation terms are flagged. Revised quotes update the same event, with earlier results retained.</desc>
<style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#24334a} .muted{fill:#65738a} .bold{font-weight:600} .blue{fill:#2563eb}</style>
<rect x="0" y="0" width="1120" height="1000" rx="16" fill="#f3f6fb" stroke="none" />
<text x="40" y="56" font-size="30" class="bold">Turn familiar work into useful actions</text>
<text x="40" y="91" font-size="20" class="muted">Provide what changed. Your assistant follows the method you've agreed on.</text>
<rect x="40" y="122" width="1040" height="108" rx="10" fill="#e9effb" stroke="none" />
<text x="62" y="156" font-size="18" class="bold blue">Your preferences, carried forward</text>
<text x="62" y="190" font-size="22" class="bold">Availability  /  Total cost with equipment  /  Cancellation terms</text>
<text x="62" y="215" font-size="17" class="muted">“Flag missing cancellation terms. I’ll ask the venue.”</text>
<rect x="40" y="254" width="1040" height="548" rx="10" fill="#fff" stroke="#dce3ed" />
<rect x="41" y="255" width="1038" height="58" rx="10" fill="#fafbfd" stroke="none" />
<text x="62" y="292" font-size="20" class="bold">Events</text>
<text x="184" y="292" font-size="18" class="muted">/   Winter meetup</text>
<rect x="934" y="273" width="122" height="27" rx="5" fill="#edf7f1" stroke="none" />
<text x="947" y="292" font-size="15" class="" style="fill:#2a7650">●  Updated</text>
<path d="M40 314H1080" stroke="#e5eaf1" />
<rect x="41" y="315" width="186" height="486" rx="0" fill="#fafbfd" stroke="none" />
<text x="62" y="352" font-size="16" class="muted">In progress</text>
<rect x="51" y="371" width="166" height="44" rx="6" fill="#eaf1ff" stroke="none" />
<text x="66" y="399" font-size="17" class="bold blue">Winter meetup</text>
<text x="66" y="452" font-size="16" class="muted">Client gathering</text>
<path d="M60 477H207" stroke="#e5eaf1" />
<text x="66" y="513" font-size="16" class="muted">Past events</text>
<path d="M227 315L227 802" stroke="#e5eaf1" />
<text x="254" y="354" font-size="25" class="bold">Venue quotes</text>
<rect x="894" y="326" width="156" height="40" rx="6" fill="#2563eb" stroke="none" />
<text text-anchor="middle" x="972.0" y="352" font-size="15" class="" style="fill:#fff">＋ Compare quotes</text>
<text x="254" y="385" font-size="17" class="muted">Dec 14 · 30 guests · Comparing 3 quotes</text>
<rect x="254" y="407" width="796" height="85" rx="7" fill="#f0f5ff" stroke="none" />
<text x="272" y="437" font-size="20" class="bold">Two venues available. Ask Green Studio about cancellation.</text>
<text x="272" y="470" font-size="17" class="muted">Projector included in the updated quote. Expand sources below.</text>
<rect x="254" y="510" width="796" height="40" rx="5" fill="#f6f8fb" stroke="none" />
<text x="268" y="537" font-size="17" class="muted">Venue</text>
<text x="480" y="537" font-size="17" class="muted">Availability</text>
<text x="635" y="537" font-size="16" class="muted">Total incl. equipment</text>
<text x="831" y="537" font-size="16" class="muted">Free cancellation until</text>
<text x="268" y="583" font-size="18" class="">Green Studio</text>
<text x="480" y="583" font-size="18" class="" style="fill:#2a7650">Available</text>
<text x="635" y="583" font-size="18" class="bold">¥6,800</text>
<rect x="825" y="562" width="82" height="28" rx="4" fill="#fff4dc" stroke="none" />
<text x="833" y="582" font-size="15" class="" style="fill:#946013">Ask venue</text>
<path d="M254 602H1050" stroke="#e5eaf1" />
<text x="268" y="635" font-size="18" class="">Riverside Hall</text>
<text x="480" y="635" font-size="18" class="" style="fill:#2a7650">Available</text>
<text x="635" y="635" font-size="18" class="bold">¥7,500</text>
<text x="831" y="635" font-size="18" class="">Dec 10</text>
<path d="M254 654H1050" stroke="#e5eaf1" />
<text x="268" y="687" font-size="18" class="">West Workshop</text>
<text x="480" y="687" font-size="18" class="">Booked</text>
<text x="635" y="687" font-size="18" class="bold">¥7,200</text>
<text x="831" y="687" font-size="18" class="">Dec 9</text>
<path d="M254 706H1050" stroke="#e5eaf1" />
<text x="256" y="742" font-size="17" class="muted">›  Original quotes &amp; sources</text>
<text x="837" y="742" font-size="17" class="muted">›  Previous results (2)</text>
<path d="M254 759H1050" stroke="#e5eaf1" />
<text x="256" y="785" font-size="16" class="muted">New quote? Continue the same event.</text>
<rect x="40" y="826" width="1040" height="126" rx="10" fill="#fff" stroke="#dce3ed" />
<text x="62" y="860" font-size="21" class="bold">A revised quote arrives</text>
<text x="62" y="890" font-size="17" class="blue">Add a quote</text>
<rect x="210" y="865" width="544" height="40" rx="6" fill="#f8fafc" stroke="#e0e6ef" />
<text x="226" y="891" font-size="17" class="muted">Updated Green Studio quote, with projector.</text>
<rect x="774" y="865" width="126" height="40" rx="6" fill="#2563eb" stroke="none" />
<text text-anchor="middle" x="837.0" y="891" font-size="17" class="" style="fill:#fff">Update</text>
<text x="62" y="931" font-size="18" class="muted">Continue in the background  →  Receive updates  →  Keep every version</text>
<text x="40" y="982" font-size="15" class="muted">Illustrative workbench with fictional venues and prices. Features adapt to your work.</text>
</svg>